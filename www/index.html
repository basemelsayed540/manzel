<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3730A3">
<meta name="color-scheme" content="light dark">
<title>منزّل</title>
<script>
  // تطبيق الوضع قبل الرسم لتفادي الوميض
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem('manzel.theme')); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/fonts.css?v=1.0.0">
<link rel="stylesheet" href="css/app.css?v=1.0.0">
<script src="js/version.js?v=1.0.0"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>
    <h1>منزّل</h1>
    <span id="mockBadge" class="mock-badge" hidden>تجريبي</span>
  </div>
  <div class="top-actions">
    <button class="top-btn" id="btnHistory" type="button" aria-label="السجل">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button class="top-btn" id="btnSettings" type="button" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="top-btn" id="btnTheme" type="button" aria-label="تبديل الوضع الفاتح والداكن">
      <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="top-btn" id="btnUpdate" type="button" aria-label="تحديث">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12A9 9 0 0 1 18.5 5.8"/><path d="M18 2v4h-4"/><path d="M6 22v-4h4"/></svg>
      <i class="dot" id="updDot" hidden></i>
    </button>
  </div>
</header>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<div id="appBanner" class="app-banner" hidden>
  <div class="ab-text">
    <strong id="abTitle">تحديث جديد للتطبيق</strong>
    <span id="abSub"></span>
  </div>
  <button class="btn primary sm" id="abBtn" type="button">تحميل وتثبيت</button>
  <div class="ab-bar" id="abBar" hidden><i></i></div>
</div>

<main id="panels" class="panels"></main>

<nav id="tabs" class="tabs" aria-label="المنصات"></nav>

<div id="overlayRoot"></div>

<script src="js/native.js?v=1.0.0"></script>
<script src="js/app.js?v=1.0.0"></script>
</body>
</html>
